<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>~/.local/share/fonts</dir>

  <!-- Match Calibri Bold variants (contains Calibri and Bold) -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Calibri</string>
    </test>
    <test name="family" compare="contains">
      <string>Bold</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Calibri</string>
    </edit>
    <edit name="weight" mode="assign" binding="same">
      <int>200</int>
    </edit>
  </match>

  <!-- Match Calibri Italic variants (contains Calibri and Italic) -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Calibri</string>
    </test>
    <test name="family" compare="contains">
      <string>Italic</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Calibri</string>
    </edit>
    <edit name="slant" mode="assign" binding="same">
      <int>100</int>
    </edit>
  </match>

  <!-- Match Calibri BoldItalic variants (contains Calibri, Bold, and Italic) -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Calibri</string>
    </test>
    <test name="family" compare="contains">
      <string>Bold</string>
    </test>
    <test name="family" compare="contains">
      <string>Italic</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Calibri</string>
    </edit>
    <edit name="weight" mode="assign" binding="same">
      <int>200</int>
    </edit>
    <edit name="slant" mode="assign" binding="same">
      <int>100</int>
    </edit>
  </match>

  <!-- Match Wingdings variants (contains Wingdings) and map to Wingdings -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Wingdings</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Wingdings</string>
    </edit>
  </match>

  <!-- Native 1080p 1:1 Pixel-Perfect Sharpness (Scale 1.0 with DPI 86) -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
